name: CraftMaster
main: fr.lordfinn.craftMaster.CraftMaster
version: 1.0.0
api-version: 1.21
author: LordFinn
description: Gestion de tasks, scores, busts (têtes) et placeholders pour CraftMaster.
softdepend: [PlaceholderAPI]
commands:
  craftMasterAddTask:
    description: Ajoute une task à une saison
    permission: craftmaster.admin
    usage: /craftMasterAddTask <SEASON> <TASK_NAME>
    aliases: [cfat]
  craftMasterRemoveTask:
    description: Supprime une task d'une saison
    permission: craftmaster.admin
    usage: /craftMasterRemoveTask <SEASON> <TASK_NAME>
    aliases: [cfrt]
  craftMasterRenameTask:
    description: Renomme une task d'une saison
    permission: craftmaster.admin
    usage: /craftMasterRenameTask <SEASON> <OLD_TASK_NAME> <NEW_TASK_NAME>
    aliases: [cfrn]
  craftMasterSetScore:
    description: Définit le score d'un joueur pour une season/task
    permission: craftmaster.admin
    usage: /craftMasterSetScore <SEASON> <TASK_NAME> <PSEUDO> <SCORE>
    aliases: [cfss]
  craftMasterReloadScores:
    description: Recharge les scores et met à jour têtes & text displays
    permission: craftmaster.admin
    usage: /craftMasterReloadScores
    aliases: [cfrs]
  craftMasterAddBust:
    description: Enregistre la tête que le joueur regarde pour une saison/classement
    permission: craftmaster.admin
    usage: /craftMasterAddBust <SEASON> <RANK>
    aliases: [cfab]
  image:
    description: Importe une image facilement avec une URL.
    usage: /image <URL>
    permission: craftmaster.image
    permission-message: Vous n'avez pas la permission d'utiliser cette commande.