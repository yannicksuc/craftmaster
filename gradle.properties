org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
# Configure only the nodes needed for the requested tasks
org.gradle.configureondemand=true

# Minecraft, Fabric Loader and Fabric API versions are per node: versions/26.3/gradle.properties, versions/26.2/gradle.properties
# Minecraft 26.x ships unobfuscated: Loom's "net.fabricmc.fabric-loom" plugin, no mappings

mod_id=craftmaster
mod_version=2.0.0
maven_group=fr.lordfinn

# Reads the plugin's config.yml unchanged (bundled in the jar)
snakeyaml_version=2.3
# Optional video library of the studio screens (compile only): https://modrinth.com/mod/watermedia
watermedia_version=3.0.1
