# Minecraft 26.2 node (the event's modpack: Immersive Melodies, Joy of Painting... exist in 26.2 only)
minecraft_version=26.2
fabric_loader_version=0.20.1
fabric_api_version=0.161.0+26.2
# Dev run folders, relative to the repository root (separate from 26.3's: worlds are not compatible back)
run_dir=run-26.2
run2_dir=run2-26.2
run_server_dir=run-server-26.2
# Shaders: converted at build time to 26.2 GLSL (#moj_import, no explicit locations), see build.gradle.kts
glsl_dialect=moj_import
# Axiom 6.1.5 for 26.2 (Modrinth version id), optional: travelling steps edited with its gizmos (client/axiom)
axiom_version=rp1ZXDHe
